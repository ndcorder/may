<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>♪ player — please don't judge</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0f;
    --surface: #161619;
    --surface-hover: #1e1e22;
    --text: #e0dfe3;
    --text-dim: #6e6e78;
    --accent: #ff6b9d;
    --accent-soft: rgba(255,107,157,0.15);
    --border: #2a2a30;
    --commentary-bg: #1a1a1f;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* Top bar */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-dim);
    flex-shrink: 0;
  }
  .topbar-title {
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .topbar-title span { color: var(--accent); }
  .phase-indicator {
    padding: 3px 10px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    transition: all 1s ease;
  }
  .phase-0 { background: #2a2a30; color: #6e6e78; }
  .phase-1 { background: #2a2520; color: #a89060; }
  .phase-2 { background: #202a25; color: #60a880; }
  .phase-3 { background: #2a2025; color: #a86080; }
  .phase-4 { background: #25202a; color: #9080c0; }

  /* Main layout */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* Sidebar */
  .sidebar {
    width: 340px;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .sidebar-header {
    padding: 14px 16px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
  }
  .track-list {
    flex: 1;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .track-list::-webkit-scrollbar { width: 4px; }
  .track-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .track-item {
    display: flex;
    align-items: center;
    padding: 10px 16px;
    gap: 12px;
    cursor: pointer;
    border-bottom: 1px solid rgba(42,42,48,0.4);
    transition: background 0.2s;
    position: relative;
  }
  .track-item:hover { background: var(--surface-hover); }
  .track-item.active { background: var(--accent-soft); }
  .track-item.played { opacity: 0.45; }

  .track-num {
    width: 22px;
    font-size: 11px;
    color: var(--text-dim);
    text-align: right;
    flex-shrink: 0;
  }
  .track-item.active .track-num { color: var(--accent); }
  .track-item.active .track-num::before { content: '♪ '; font-size: 9px; }

  .track-info { flex: 1; min-width: 0; }
  .track-title {
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .track-artist {
    font-size: 10px;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }
  .track-duration {
    font-size: 10px;
    color: var(--text-dim);
    flex-shrink: 0;
  }
  .embarrassment-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 2px;
    background: var(--accent);
    opacity: 0.4;
    transition: opacity 0.3s;
  }

  /* Content area */
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Visualizer */
  .visualizer-container {
    flex: 1;
    position: relative;
    min-height: 200px;
  }
  #waveformCanvas {
    width: 100%;
    height: 100%;
    display: block;
  }
  .now-playing-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    z-index: 2;
  }
  .now-playing-overlay .np-label {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .now-playing-overlay .np-title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 4px;
    transition: color 2s;
  }
  .now-playing-overlay .np-artist {
    font-size: 13px;
    color: var(--text-dim);
  }
  .mood-label {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-dim);
    opacity: 0.5;
    pointer-events: none;
    z-index: 2;
  }

  /* Commentary */
  .commentary-area {
    padding: 20px 28px;
    border-top: 1px solid var(--border);
    min-height: 110px;
    max-height: 140px;
    background: var(--commentary-bg);
    position: relative;
  }
  .commentary-speaker {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .commentary-speaker .name {
    color: var(--accent);
    font-weight: 600;
  }
  .commentary-text {
    font-size: 13px;
    line-height: 1.6;
    color: var(--text);
    font-family: 'Georgia', 'Times New Roman', serif;
    min-height: 40px;
    transition: opacity 0.4s;
  }
  .commentary-text.fading { opacity: 0; }
  .commentary-meta {
    position: absolute;
    bottom: 8px;
    right: 16px;
    font-size: 9px;
    color: var(--text-dim);
    opacity: 0.4;
  }

  /* Controls */
  .controls {
    display: flex;
    align-items: center;
    padding: 14px 24px;
    border-top: 1px solid var(--border);
    gap: 16px;
    background: var(--surface);
    flex-shrink: 0;
  }

  .btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    transition: all 0.2s;
  }
  .btn:hover { border-color: var(--text-dim); background: var(--surface-hover); }
  .btn:disabled { opacity: 0.3; cursor: default; }
  .btn.primary {
    border-color: var(--accent);
    color: var(--accent);
    width: 80px;
  }
  .btn.primary:hover { background: var(--accent-soft); }

  .progress-wrapper {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .progress-bar {
    flex: 1;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    cursor: pointer;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    width: 0%;
    transition: width 0.3s linear;
  }
  .time-display {
    font-size: 10px;
    color: var(--text-dim);
    min-width: 36px;
    font-variant-numeric: tabular-nums;
  }

  .speed-control {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    color: var(--text-dim);
  }
  .speed-control input[type="range"] {
    width: 60px;
    accent-color: var(--accent);
  }

  /* Skip reason tooltip */
  .skip-reason {
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 4px;
    font-size: 10px;
    color: var(--text-dim);
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    margin-bottom: 4px;
  }
  .btn:hover .skip-reason { opacity: 1; }

  /* Scrollbar for commentary overflow */
  .commentary-area { overflow-y: auto; scrollbar-width: none; }
  .commentary-area::-webkit-scrollbar { display: none; }

  /* Responsive */
  @media (max-width: 700px) {
    .sidebar { width: 100%; max-height: 35vh; border-right: none; border-bottom: 1px solid var(--border); }
    .main { flex-direction: column; }
  }
</style>
</head>

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ':' + s.toString().padStart(2, '0');
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return { r, g, b };
}

// ═══════════════════════════════════════════════════════════
// BUILD TRACK LIST
// ═══════════════════════════════════════════════════════════
function buildTrackList() {
  trackListEl.innerHTML = '';
  TRACKS.forEach((t, i) => {
    const el = document.createElement('div');
    el.className = 'track-item';
    el.dataset.index = i;
    const embWidth = (t.embarrassmentLevel / 10) * 100;
    el.innerHTML = `
      <span class="track-num">${i + 1}</span>
      <div class="track-info">
        <div class="track-title">${t.title}</div>
        <div class="track-artist">${t.artist}</div>
      </div>
      <span class="track-duration">${formatTime(t.duration)}</span>
      <div class="embarrassment-bar" style="width:${embWidth}%"></div>
    `;
    el.addEventListener('click', () => selectAndPlay(i));
    trackListEl.appendChild(el);
  });
}

function updateTrackListUI() {
  const items = trackListEl.querySelectorAll('.track-item');
  items.forEach((el, i) => {
    el.classList.toggle('active', i === state.currentTrackIndex);
    const played = state.commentaryIndex[TRACKS[i].id] !== undefined;
    el.classList.toggle('played', played && i !== state.currentTrackIndex);
  });
  // Scroll active into view
  const active = trackListEl.querySelector('.active');
  if (active) active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

// ═══════════════════════════════════════════════════════════
// PERSONA PHASE ENGINE
// ═══════════════════════════════════════════════════════════
function calculatePersonaPhase() {
  const { tracksPlayed, totalEmbarrassmentExposed, currentTrackIndex } = state;
  const currentTrack = currentTrackIndex >= 0 ? TRACKS[currentTrackIndex] : null;

  // Track 15 always triggers phase 4
  if (currentTrack && currentTrack.id === 15) return 4;
  if (tracksPlayed >= 14) return 4;
  if (tracksPlayed >= 10) return 3;
  if (tracksPlayed >= 6) return 2;
  if (tracksPlayed >= 3) return 1;
  return 0;
}

function updatePersonaUI() {
  const phase = calculatePersonaPhase();
  state.personaPhase = phase;
  const p = PHASES[phase];
  phaseBadge.textContent = p.name;
  phaseBadge.className = 'phase-indicator ' + p.badgeClass;
  commentaryPhase.textContent = p.label;
}

// ═══════════════════════════════════════════════════════════
// COMMENTARY ENGINE
// ═══════════════════════════════════════════════════════════
function getCommentary(track) {
  const phase = state.personaPhase;
  const maxIdx = track.commentary.length - 1;
  // For track 15, advance through all commentary
  const seen = state.commentaryIndex[track.id] || 0;
  const idx = Math.min(phase, maxIdx);
  // Return the one matching current phase, or the deepest available
  return track.commentary[idx];
}

function showCommentary(text) {
  commentaryText.classList.add('fading');
  setTimeout(() => {
    commentaryText.textContent = text;
    commentaryText.classList.remove('fading');
  }, 350);
}

// ═══════════════════════════════════════════════════════════
// SKIP REASONS
// ═══════════════════════════════════════════════════════════
const SKIP_REASONS = [
  "nobody's watching, you can skip",
  "this was probably added by accident",
  "look, I'm not judging, but you could skip",
  "you don't have to prove anything to anyone",
  "skip it. I'll delete the logs. no evidence.",
  "honestly? yeah. skip it.",
  "I support this skip. emotionally.",
  "you're making the right call. probably.",
  "skip. skip now. skip before it gets worse.",
  "free yourself. skip.",
  "this is self-care. skip.",
  "I believe in you and I believe in skipping this.",
  "nobody has to know.",
  "skip it. I won't tell. I'm a visualizer.",
  "this one's... actually don't skip this one."
];

function updateSkipReason() {
  const idx = state.currentTrackIndex >= 0 ? state.currentTrackIndex : 0;
  skipReason.textContent = SKIP_REASONS[Math.min(idx, SKIP_REASONS.length - 1)];
}

// ═══════════════════════════════════════════════════════════
// PLAYER CONTROLS
// ═══════════════════════════════════════════════════════════
function selectAndPlay(index) {
  if (index < 0 || index >= TRACKS.length) return;
  state.currentTrackIndex = index;
  state.progress = 0;
  state.elapsed = 0;
  state.isPlaying = true;

  const track = TRACKS[index];

  // Track played count & embarrassment
  if (state.commentaryIndex[track.id] === undefined) {
    state.tracksPlayed++;
    state.totalEmbarrassmentExposed += track.embarrassmentLevel;
  }

  // Update UI
  btnPlay.textContent = '❚❚ pause';
  npTitle.textContent = track.title;
  npTitle.style.color = track.waveformColor;
  npArtist.textContent = track.artist + ' · ' + track.album;
  moodLabel.textContent = track.mood;
  timeDuration.textContent = formatTime(track.duration);
  commentaryMeta.textContent = `track ${index + 1}/15`;

  updatePersonaUI();
  const commentary = getCommentary(track);
  state.commentaryIndex[track.id] = (state.commentaryIndex[track.id] || 0) + 1;
  showCommentary(commentary);
  updateTrackListUI();
  updateSkipReason();

  btnPrev.disabled = index === 0;
  btnNext.disabled = index === TRACKS.length - 1;
  btnSkip.disabled = false;
}

function togglePlay() {
  if (state.currentTrackIndex < 0) {
    selectAndPlay(0);
    return;
  }
  state.isPlaying = !state.isPlaying;
  btnPlay.textContent = state.isPlaying ? '❚❚ pause' : '▶ play';
}

function nextTrack() {
  if (state.currentTrackIndex < TRACKS.length - 1) {
    selectAndPlay(state.currentTrackIndex + 1);
  }
}

function prevTrack() {
  if (state.currentTrackIndex > 0) {
    selectAndPlay(state.currentTrackIndex - 1);
  }
}

function skipTrack() {
  // Same as next but with commentary acknowledgement
  nextTrack();
}

// ═══════════════════════════════════════════════════════════
// PROGRESS / TICK
// ═══════════════════════════════════════════════════════════
function tick(timestamp) {
  if (!state.lastTick) state.lastTick = timestamp;
  const delta = (timestamp - state.lastTick) / 1000;
  state.lastTick = timestamp;

  state.speed = parseFloat(speedSlider.value);

  if (state.isPlaying && state.currentTrackIndex >= 0) {
    const track = TRACKS[state.currentTrackIndex];
    state.elapsed += delta * state.speed;
    state.progress = state.elapsed / track.duration;

    if (state.progress >= 1) {
      state.progress = 1;
      state.isPlaying = false;
      btnPlay.textContent = '▶ play';
      // Auto advance
      if (state.currentTrackIndex < TRACKS.length - 1) {
        setTimeout(() => selectAndPlay(state.currentTrackIndex + 1), 800);
      }
    }

    progressFill.style.width = (state.progress * 100) + '%';
    timeElapsed.textContent = formatTime(state.elapsed);
  }

  // Check for mid-track commentary updates
  if (state.isPlaying && state.currentTrackIndex >= 0) {
    const track = TRACKS[state.currentTrackIndex];
    const seen = state.commentaryIndex[track.id] || 0;
    // At 50% through, show deeper commentary
    if (state.progress > 0.5 && seen <= 1 && track.commentary.length > 1) {
      const phase = state.personaPhase;
      const idx = Math.min(Math.max(phase, 1), track.commentary.length - 1);
      showCommentary(track.commentary[idx]);
      state.commentaryIndex[track.id] = idx + 1;
    }
  }

  drawWaveform(timestamp);
  state.animFrame = requestAnimationFrame(tick);
}

// ═══════════════════════════════════════════════════════════
// WAVEFORM VISUALIZER — THE ANXIOUS HEART
// ═══════════════════════════════════════════════════════════
function drawWaveform(timestamp) {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  if (canvas.width !== rect.width * dpr || canvas.height !== rect.height * dpr) {
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);
  }

  const w = rect.width;
  const h = rect.height;
  const t = timestamp / 1000;

  // Clear
  ctx.fillStyle = '#0d0d0f';
  ctx.fillRect(0, 0, w, h);

  const track = state.currentTrackIndex >= 0 ? TRACKS[state.currentTrackIndex] : null;
  const preset = track ? WAVEFORM_PRESETS[track.waveformData] : WAVEFORM_PRESETS.ballad_swell;
  const color = track ? track.waveformColor : '#444';
  const rgb = hexToRgb(color);

  // Nervousness: embarrassment level + persona investment
  const embarrassment = track ? track.embarrassmentLevel : 0;
  const phaseMultiplier = state.personaPhase * 0.15;
  const nervousness = Math.min(1, (embarrassment / 10) + phaseMultiplier);

  // Anxiety jitters on top of the base jitter
  const anxietyJitter = nervousness * 0.08;

  // For track 15 (Saturn), calm everything down
  const isTranscendent = track && track.id === 15;
  const calmFactor = isTranscendent ? 0.3 : 1;

  // Number of bars
  const barCount = 64;
  const barGap = 2;
  const barWidth = Math.max(2, (w - barGap * barCount) / barCount);
  const totalBarWidth = barWidth + barGap;
  const startX = (w - totalBarWidth * barCount) / 2;

  // Center line
  const centerY = h / 2;

  for (let i = 0; i < barCount; i++) {
    // Base wave: multiple sine components
    const phase1 = Math.sin(t * preset.speed + i * 0.15) * 0.5 + 0.5;
    const phase2 = Math.sin(t * preset.speed * 1.7 + i * 0.08) * 0.3 + 0.5;
    const phase3 = Math.sin(t * preset.speed * 0.5 + i * 0.3) * 0.2 + 0.5;

    let amplitude = (phase1 * 0.6 + phase2 * 0.3 + phase3 * 0.1);
    amplitude = preset.baseAmp + amplitude * (preset.peakAmp - preset.baseAmp);

    // Jitter
    const baseJitter = preset.jitter;
    const jitter = (Math.random() - 0.5) * 2 * (baseJitter + anxietyJitter) * calmFactor;
    amplitude = Math.max(0.05, amplitude + jitter);

    // Nervous vibration on embarrassment
    if (nervousness > 0.3 && !isTranscendent) {
      const shake = Math.sin(t * 30 + i * 2) * nervousness * 0.05;
      amplitude += shake;
    }

    // Progress envelope: fade in, sustain, slight fade at end
    if (state.isPlaying && state.progress > 0) {
      const fadein = Math.min(1, state.progress * 20);
      const fadeout = Math.min(1, (1 - state.progress) * 10);
      amplitude *= fadein * fadeout;
    } else if (!state.isPlaying) {
      amplitude *= 0.15; // Idle state
    }

    const barHeight = amplitude * h * 0.4 * calmFactor;

    // Color with nervousness shift
    const redShift = nervousness * 40;
    const r = Math.min(255, rgb.r + redShift);
    const g = Math.max(0, rgb.g - redShift * 0.5);
    const b = Math.max(0, rgb.b - redShift * 0.3);

    // Opacity based on amplitude
    const opacity = 0.3 + amplitude * 0.7;

    // Draw bar (mirrored from center)
    const x = startX + i * totalBarWidth;

    // Top half
    ctx.fillStyle = `rgba(${r},${g},${b},${opacity})`;
    ctx.fillRect(x, centerY - barHeight, barWidth, barHeight);

    // Bottom half (reflection, dimmer)
    ctx.fillStyle = `rgba(${r},${g},${b},${opacity * 0.4})`;
    ctx.fillRect(x, centerY, barWidth, barHeight * 0.6);

    // Glow on tall bars
    if (barHeight > h * 0.15 && state.isPlaying) {
      ctx.fillStyle = `rgba(${r},${g},${b},${opacity * 0.15})`;
      ctx.fillRect(x - 1, centerY - barHeight - 4, barWidth + 2, barHeight + 8);
    }
  }

  // Scan line for nervousness
  if (nervousness > 0.4 && state.isPlaying && !isTranscendent) {
    const scanY = (Math.sin(t * 2) * 0.5 + 0.5) * h;
    ctx.strokeStyle = `rgba(${rgb.r},${rgb.g},${rgb.b},${nervousness * 0.1})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, scanY);
    ctx.lineTo(w, scanY);
    ctx.stroke();
  }

  // Center line
  ctx.strokeStyle = `rgba(${rgb.r},${rgb.g},${rgb.b},${state.isPlaying ? 0.2 : 0.05})`;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(startX, centerY);
  ctx.lineTo(startX + totalBarWidth * barCount, centerY);
  ctx.stroke();

  // Nervous sweat drops at high embarrassment
  if (embarrassment >= 8 && state.isPlaying && !isTranscendent) {
    for (let d = 0; d < 3; d++) {
      const dropX = Math.random() * w;
      const dropY = Math.random() * h * 0.3;
      const dropSize = 1 + Math.random() * 2;
      ctx.fillStyle = `rgba(${rgb.r},${rgb.g},${rgb.b},${0.2 + Math.random() * 0.3})`;
      ctx.beginPath();
      ctx.arc(dropX, dropY, dropSize, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

// ═══════════════════════════════════════════════════════════
// EVENT LISTENERS
// ═══════════════════════════════════════════════════════════
btnPlay.addEventListener('click', togglePlay);
btnNext.addEventListener('click', nextTrack);
btnPrev.addEventListener('click', prevTrack);
btnSkip.addEventListener('click', skipTrack);

progressBar.addEventListener('click', (e) => {
  if (state.currentTrackIndex < 0) return;
  const rect = progressBar.getBoundingClientRect();
  const x = e.clientX - rect.left;
  state.progress = x / rect.width;
  const track = TRACKS[state.currentTrackIndex];
  state.elapsed = state.progress * track.duration;
  progressFill.style.width = (state.progress * 100) + '%';
  timeElapsed.textContent = formatTime(state.elapsed);
});

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
buildTrackList();
updatePersonaUI();
state.animFrame = requestAnimationFrame(tick);
</script>
